# JARVIS morning sync.
#
# Put this at .github/workflows/jarvis-morning-sync.yml in the repository.
# It calls the site's scheduled-sync endpoint once a day with a shared secret.
#
# Setup, once:
#   1. Repository → Settings → Secrets and variables → Actions → New repository
#      secret, named JARVIS_SYNC_SECRET, value = the same secret set on the site
#      as SYNC_SECRET.
#   2. Actions tab → "JARVIS morning sync" → Run workflow, to test it by hand.
#
# 13:00 UTC is 6:00 AM in Arizona (UTC-7, no daylight saving). Change the hour
# in the cron line for a different local time.
#
# Note: GitHub's scheduler can run late by a few minutes to about an hour under
# load, and it disables scheduled workflows after 60 days without repository
# activity. The site also runs a catch-up sync when you open it, so a missed
# morning corrects itself the next time you visit.

name: JARVIS morning sync

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the site to sync Google
        env:
          SYNC_SECRET: ${{ secrets.JARVIS_SYNC_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_SECRET}" ]; then
            echo "JARVIS_SYNC_SECRET is not set on this repository."
            exit 1
          fi
          response=$(curl -sS -X POST \
            "https://jarvis-command-center-ud6zar.freebuff.site/api/cron/sync" \
            -H "Authorization: Bearer ${SYNC_SECRET}" \
            -w '\n%{http_code}')
          body=$(printf '%s' "$response" | sed '$d')
          status=$(printf '%s' "$response" | tail -n1)
          echo "status: $status"
          echo "body: $body"
          test "$status" = "200"
          # Fail the job when any account needs reconnecting, so the weekly
          # Google token expiry shows up as a red run rather than a silent gap.
          printf '%s' "$body" | grep -q '"failed":0'

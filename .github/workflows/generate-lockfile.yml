name: Generate package-lock
on:
  push:
    paths:
      - .github/workflows/generate-lockfile.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate lockfile from package.json
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
            exit 0
          fi
          git commit -m "Add package-lock.json so installs use exact versions"
          git push
